<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="color-scheme" content="dark">
  <meta name="supported-color-schemes" content="dark">
  <title>Kommu</title>
  <style type="text/css">
    @font-face {
      font-family: 'Glacial Indifference';
      src: url('https://kommu.ai/css/fonts/glacialindifference-regular-webfont.woff2') format('woff2'),
           url('https://kommu.ai/css/fonts/glacialindifference-regular-webfont.woff') format('woff');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Glacial Indifference';
      src: url('https://kommu.ai/css/fonts/glacialindifference-bold-webfont.woff2') format('woff2'),
           url('https://kommu.ai/css/fonts/glacialindifference-bold-webfont.woff') format('woff');
      font-weight: 700;
      font-style: normal;
    }
    ::selection {
      background-color: #3d1a78;
      color: rgb(241, 241, 241);
    }
    ::-moz-selection {
      background-color: #3d1a78;
      color: rgb(241, 241, 241);
    }
    .email-glass-btn {
      border-radius: 999px !important;
      opacity: 1 !important;
      background-color: #1a1528 !important;
      border: 0.5px solid transparent !important;
      background-image: linear-gradient(150deg, rgba(61, 26, 120, 0.15) 0%, rgba(255, 255, 255, 0.01) 48%, rgba(61, 26, 120, 0.35) 100%), linear-gradient(rgba(12, 8, 18, 1), rgba(12, 8, 18, 1)), linear-gradient(30deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.0) 48%, rgba(255, 255, 255, 0.1) 100%) !important;
      background-origin: padding-box, padding-box, border-box !important;
      background-clip: padding-box, padding-box, border-box !important;
    }
    .email-glass-btn-outline {
      border-radius: 999px !important;
      opacity: 0.75 !important;
      background-color: rgba(255, 255, 255, 0.02) !important;
      /* stroke disabled:
      border: 2px solid transparent !important;
      background-image: linear-gradient(rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.02)), linear-gradient(20deg, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0) 50%, rgba(255, 255, 255, 0.75) 100%) !important;
      background-origin: padding-box, border-box !important;
      background-clip: padding-box, border-box !important;
      */
    }
  </style>
  <!--[if mso]>
  <style type="text/css">
    body, table, td { font-family: Arial, Helvetica, sans-serif !important; }
  </style>
  <![endif]-->
</head>
<body style="margin: 0; padding: 0; width: 100% !important; background-color: #000000; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; font-family: 'Glacial Indifference', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <div style="display: none; max-height: 0; overflow: hidden; mso-hide: all;">
    Kommu — driver-assist technology for Malaysian roads.
  </div>
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color: #000000; font-family: 'Glacial Indifference', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <tr>
      <td align="center" style="padding: 32px 16px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width: 600px;">
          <tr>
            <td class="email-body" style="padding: 0 0 28px; font-family: 'Glacial Indifference', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.65; color: rgb(241, 241, 241);">
              {{content}}
            </td>
          </tr>
          <tr>
            <td align="center" style="padding: 28px 16px 0; font-family: 'Glacial Indifference', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; line-height: 1.5; color: #888888;">
              <p style="margin: 0 0 8px;">
                <a href="https://kommu.ai" style="color: rgb(241, 241, 241); text-decoration: none;">kommu.ai</a>
                &nbsp;·&nbsp;
                <a href="mailto:support@kommu.ai" style="color: rgb(241, 241, 241); text-decoration: none;">support@kommu.ai</a>
              </p>
              <p style="margin: 12px 0 0; color: #555555; font-size: 12px;">
                Click <a href="{{unsubscribe_url}}" style="color: #555555; text-decoration: none;">unsubscribe</a> to opt out.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
